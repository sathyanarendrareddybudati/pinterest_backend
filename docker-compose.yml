version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pinterest_postgres
    environment:
      POSTGRES_USER: pinterest_user
      POSTGRES_PASSWORD: pinterest_password
      POSTGRES_DB: pinterest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinterest_user -d pinterest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinterest_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pinterest_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinterest_network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: pinterest_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pinterest_network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinterest_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://pinterest_user:pinterest_password@postgres:5432/pinterest
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # Elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: pins
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: changeme
      
      # Security
      SECRET_KEY: b1e2f3g4h5i6j7k8l9m0n1o2p3q4r5s6t7u8v9w0x1y2z3a4
      ALGORITHM: HS256
      
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: dgsyfonz8
      CLOUDINARY_API_KEY: 226568586269397
      CLOUDINARY_API_SECRET: 8I7jR_F2RAzWde1yeTENfZ9-anM
    
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - pinterest_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  pinterest_network:
    driver: bridge
